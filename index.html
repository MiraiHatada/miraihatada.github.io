  <style>
    /* --- Base & Reset --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #3a6ea5;
      font-family: "BIZ UDPGothic", sans-serif;
      font-size: 12px;
      color: #000000;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }
    /* --- Classic Window Frame --- */
    .window {
      width: 100%;
      max-width: 420px;
      background: #d4d0c8;
      border: 1px solid;
      border-color: #dfdfdf #808080 #808080 #dfdfdf;
      box-shadow: 
        -1px -1px 0 0 #ffffff,
        1px 1px 0 0 #000000,
        2px 2px 8px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
    }
    /* --- Title Bar & Direct SVG Controls --- */
    .title-bar {
      background: linear-gradient(90deg, #0a246a 0%, #a6caf0 100%);
      padding: 3px 3px 3px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      font-weight: bold;
      user-select: none;
    }
    .title-left {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow: hidden;
      white-space: nowrap;
    }
    .title-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .title-text {
      letter-spacing: 0.03em;
    }
    .title-controls {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }
    .btn-control {
      width: 16px;
      height: 14px;
      background: #d4d0c8;
      border: 1px solid;
      border-color: #ffffff #000000 #000000 #ffffff;
      box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }
    .btn-control svg {
      display: block;
    }
    .btn-control:active {
      border-color: #000000 #ffffff #ffffff #000000;
      box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #dfdfdf;
      padding-top: 1px;
      padding-left: 1px;
    }
    /* --- Classic Menu Bar --- */
    .menu-bar {
      display: flex;
      gap: 12px;
      padding: 2px 8px;
      border-bottom: 1px solid #808080;
      user-select: none;
    }
    .menu-item u {
      text-decoration: underline;
    }
    .window-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    /* --- Profile Section --- */
    .profile-card {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .avatar-frame {
      width: 72px;
      height: 72px;
      flex-shrink: 0;
      background: #ffffff;
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
      box-shadow: inset 1px 1px 0 #000000, inset -1px -1px 0 #dfdfdf;
      padding: 2px;
    }
    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      line-height: 1.4;
      min-width: 0;
      overflow: hidden;
    }
    .profile-name {
      font-size: 14px;
      font-weight: bold;
    }
    .classic-url {
      color: #0000ff;
      text-decoration: underline;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .classic-url:hover {
      color: #ff0000;
    }
    /* --- Projects Group Box & List View --- */
    fieldset.group-box {
      border: 1px solid #808080;
      box-shadow: 1px 1px 0 #ffffff;
      padding: 8px;
      margin: 0;
    }
    legend {
      margin-left: 8px;
      padding: 0 4px;
      color: #000000;
      background: #d4d0c8;
    }
    .list-view {
      background: #ffffff;
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
      box-shadow: inset 1px 1px 0 #000000, inset -1px -1px 0 #dfdfdf;
      display: flex;
      flex-direction: column;
    }
    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      color: #000000;
      text-decoration: none;
      min-height: 36px;
      position: relative;
    }
    .list-item:not(:last-child):not(.empty-item)::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 8px;
      right: 8px;
      border-bottom: 1px dotted #d0d0d0;
      pointer-events: none;
    }
    .list-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .item-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .item-title {
      font-weight: bold;
    }
    .item-desc {
      color: #606060;
      font-size: 11px;
    }
    a.list-item:hover, a.list-item:focus {
      background-color: #0a246a;
      color: #ffffff;
      outline: 1px dotted #ffffff;
      outline-offset: -1px;
    }
    a.list-item:hover .item-desc, a.list-item:focus .item-desc {
      color: #e0e0e0;
    }
    a.list-item:hover .item-arrow, a.list-item:focus .item-arrow {
      color: #ffffff;
    }
    .item-arrow {
      font-size: 11px;
      color: #808080;
    }
    .list-item.empty-item {
      cursor: default;
      user-select: none;
    }
    /* --- Status Bar & Sub-panels --- */
    .status-bar {
      border-top: 1px solid #808080;
      padding: 3px 4px;
      display: flex;
      gap: 3px;
      background: #d4d0c8;
      user-select: none;
    }
    .status-panel {
      border: 1px solid;
      border-color: #808080 #ffffff #ffffff #808080;
      padding: 1px 6px;
      font-size: 11px;
      color: #202020;
    }
    .status-panel.flex-1 {
      flex: 1;
    }
    .status-done {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 1px 4px;
      white-space: nowrap;
      overflow: hidden;
    }
    .status-page-icon {
      width: 13px;
      height: 14px;
      display: block;
      flex-shrink: 0;
      image-rendering: pixelated;
    }
    .status-text {
      font-family: "Zen Kaku Gothic Antique", sans-serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: -0.05em;
      color: #000000;
      line-height: 1;
    }
    a.status-crystar {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #202020;
      text-decoration: none;
      cursor: default;
      user-select: none;
    }
    a.status-crystar:hover,
    a.status-crystar:focus,
    a.status-crystar:active,
    a.status-crystar:visited {
      color: #202020;
      text-decoration: none;
      outline: none;
    }
    .crystar-icon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
      display: block;
    }
  </style>
</head>
